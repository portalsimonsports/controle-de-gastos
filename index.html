<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Controle de Gastos</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#0c1422;overflow:hidden}
    #appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c1422;visibility:hidden}
    #loader{position:fixed;inset:0;display:grid;place-items:center;background:#0c1422;color:#eef4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;z-index:10}
    #loaderBox{padding:16px 20px;border:1px solid #263754;border-radius:14px;background:#121d30}
  </style>
</head>
<body>
  <div id="loader"><div id="loaderBox">Carregando…</div></div>
  <iframe id="appFrame" title="Controle de Gastos"></iframe>

  <script>
    'use strict';

    const VERSION = '202609231005';
    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const loaderBox = document.getElementById('loaderBox');

    try {
      const persisted = localStorage.getItem('cg_token');
      if (persisted && !sessionStorage.getItem('cg_token')) {
        sessionStorage.setItem('cg_token', persisted);
      }
    } catch (_) {}

    const styles = [
      'enhancements.css?v=202607142115',
      'calendar-enhancements.css?v=202607142115',
      'professional-confirm.css?v=202607142115',
      'card-period.css?v=202607142115',
      'fidelity.css?v=202607142115',
      'bus-actions.css?v=202607142115',
      'bilhetes-layout.css?v=202607142115',
      'bilhete-controls.css?v=202607142115',
      'junior-recorrencia.css?v=202607142115',
      'mobile-data-fix.css?v=202607142115',
      'finance-tools.css?v=202609230810'
    ];

    const scripts = [
      'api-timeout-fix.js?v=202607211045',
      'fast-save-ui.js?v=202609230810',
      'enhancements.js?v=202607142115',
      'query-description.js?v=202608010610',
      'calendar-enhancements.js?v=202607142115',
      'calendar-list-picker.js?v=202608020545',
      'professional-confirm.js?v=202607142115',
      'card-period.js?v=202607142115',
      'fidelity.js?v=202607142115',
      'fidelity-save-fix.js?v=202608190530',
      'bus-actions.js?v=202607142115',
      'bilhete-columns.js?v=202607142115',
      'bilhete-controls.js?v=202607142115',
      'junior-recorrencia.js?v=202607142115',
      'expense-ptbr.js?v=202607142115',
      'expense-auto-cents.js?v=202608020818',
      'bilhete-delete-fix.js?v=202607142115',
      'mobile-data-fix.js?v=202607142115',
      'bus-null-fix.js?v=202607142115',
      'expense-view-mode.js?v=202607161030',
      'finance-tools-v2.js?v=202609230820',
      'refund-money-ptbr.js?v=202609230902',
      'refund-origin-fix.js?v=202609230912'
    ];

    function injectStyle(doc, href) {
      return new Promise(resolve => {
        const link = doc.createElement('link');
        link.rel = 'stylesheet';
        link.href = './' + href;
        link.onload = resolve;
        link.onerror = resolve;
        doc.head.appendChild(link);
      });
    }

    function injectScript(doc, src) {
      return new Promise(resolve => {
        const script = doc.createElement('script');
        script.src = './' + src;
        script.async = false;
        script.onload = resolve;
        script.onerror = resolve;
        doc.body.appendChild(script);
      });
    }

    async function enhanceFrame() {
      const doc = frame.contentDocument;
      if (!doc || !doc.documentElement) throw new Error('Não foi possível abrir o sistema.');

      await Promise.all(styles.map(item => injectStyle(doc, item)));
      for (const item of scripts) await injectScript(doc, item);

      const paragraphs = [...doc.querySelectorAll('p')];
      paragraphs.forEach(p => {
        const text = String(p.textContent || '').replace(/\s+/g,' ').trim();
        if (text.includes('Página pública de acesso ao sistema. Os dados financeiros permanecem privados')) p.remove();
        if (text.includes('O e-mail precisa constar na aba GERENCIAMENTO')) p.remove();
        if (text.includes('O backend grava somente as colunas A:H da aba Despesas')) p.remove();
      });

      frame.style.visibility = 'visible';
      loader.style.display = 'none';
    }

    frame.addEventListener('load', () => {
      enhanceFrame().catch(error => {
        loaderBox.textContent = error.message || 'Falha ao carregar o sistema.';
        loader.style.display = 'grid';
      });
    });

    setInterval(() => {
      try {
        const token = sessionStorage.getItem('cg_token');
        if (token) localStorage.setItem('cg_token', token);
        else localStorage.removeItem('cg_token');
      } catch (_) {}
    }, 1000);

    frame.src = './app.html?v=' + VERSION;
  </script>
</body>
</html>
