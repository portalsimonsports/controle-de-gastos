<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07111f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Controle de Gastos">
  <link rel="manifest" href="./manifest.webmanifest?v=202610020605">
  <link rel="icon" href="./icon-192.svg?v=202610020605" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.svg?v=202610020605">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Controle de Gastos</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#07111f;overflow:hidden}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07111f}
  </style>
</head>
<body>
  <iframe id="app" title="Controle de Gastos" src="./app.html?build=202610051245"></iframe>
  <script>
    (function(){
      'use strict';
      var frame=document.getElementById('app');
      var KEY='cg_token';
      var enhanced=false;
      var restoreAttempted=false;
      var reloadForRestore=false;

      var styles=[
        'enhancements.css?v=202607142115','calendar-enhancements.css?v=202607142115','professional-confirm.css?v=202607142115',
        'card-period.css?v=202607142115','fidelity.css?v=202607142115','bus-actions.css?v=202607142115',
        'bilhetes-layout.css?v=202607142115','bilhete-controls.css?v=202607142115','junior-recorrencia.css?v=202607142115',
        'mobile-data-fix.css?v=202607142115','finance-tools.css?v=202609230810','modern-ui-2026.css?v=202610020914'
      ];
      var scripts=[
        'api-timeout-fix.js?v=202607211045','fast-save-ui.js?v=202610051245','enhancements.js?v=202607142115',
        'query-description.js?v=202608010610','calendar-enhancements.js?v=202607142115','calendar-list-picker.js?v=202608020545',
        'professional-confirm.js?v=202607142115','card-period.js?v=202607142115','fidelity.js?v=202607142115',
        'fidelity-save-fix.js?v=202608190530','bus-actions.js?v=202607142115','bilhete-columns.js?v=202607142115',
        'bilhete-controls.js?v=202607142115','junior-recorrencia.js?v=202607142115','expense-ptbr.js?v=202610051236',
        'expense-auto-cents.js?v=202608020818','bilhete-delete-fix.js?v=202607142115','mobile-data-fix.js?v=202607142115',
        'bus-null-fix.js?v=202607142115','expense-view-mode.js?v=202607161030','finance-tools-v2.js?v=202609230820',
        'refund-money-ptbr.js?v=202609230902','refund-origin-fix.js?v=202609230912',
        'birthday.js?v=202610020605','income-brl-fix.js?v=202610020605'
      ];

      function getFrame(){
        try{return frame.contentWindow||null;}catch(_){return null;}
      }

      function forceMobileMenu(){
        try{
          var win=getFrame();
          var doc=frame.contentDocument;
          if(!win||!doc)return;
          var nav=doc.getElementById('tabs');
          if(!nav)return;
          var isMobile=win.matchMedia&&win.matchMedia('(max-width:900px)').matches;
          if(!isMobile)return;

          var style=doc.getElementById('cgMobileMenuFixFinal');
          if(!style){
            style=doc.createElement('style');
            style.id='cgMobileMenuFixFinal';
            style.textContent='@media(max-width:900px){html,body{max-width:100%!important;overflow-x:hidden!important}.shell,.topbar,#privateView{max-width:100%!important}.topbar{position:static!important;display:grid!important;grid-template-columns:1fr auto!important;grid-template-areas:"brand logout" "identity countdown" "tabs tabs"!important;gap:8px 10px!important;align-items:center!important}.brand{grid-area:brand!important}.spacer{display:none!important}#identity{grid-area:identity!important;width:auto!important;min-width:0!important}#countdown{grid-area:countdown!important;text-align:right!important}#logoutButton{grid-area:logout!important;justify-self:end!important}#tabs.tabs{grid-area:tabs!important;display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;gap:8px!important;width:100%!important;max-width:100%!important;overflow-x:auto!important;overflow-y:hidden!important;padding:2px 0 8px!important;margin:2px 0 0!important;transform:none!important;scroll-behavior:smooth!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-x:contain!important;scrollbar-width:thin!important}#tabs.tabs .tab{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;width:auto!important;min-width:max-content!important;max-width:none!important;white-space:nowrap!important;overflow:visible!important;text-overflow:clip!important;text-align:center!important;line-height:1.15!important;padding:10px 16px!important;transform:none!important;box-sizing:border-box!important}}';
            doc.head.appendChild(style);
          }

          nav.style.setProperty('display','flex','important');
          nav.style.setProperty('flex-direction','row','important');
          nav.style.setProperty('flex-wrap','nowrap','important');
          nav.style.setProperty('overflow-x','auto','important');
          nav.style.setProperty('overflow-y','hidden','important');
          nav.style.setProperty('width','100%','important');
          nav.style.setProperty('max-width','100%','important');
          nav.style.setProperty('transform','none','important');

          Array.prototype.forEach.call(nav.querySelectorAll('.tab'),function(btn){
            btn.style.setProperty('display','inline-flex','important');
            btn.style.setProperty('flex','0 0 auto','important');
            btn.style.setProperty('width','auto','important');
            btn.style.setProperty('min-width','max-content','important');
            btn.style.setProperty('max-width','none','important');
            btn.style.setProperty('white-space','nowrap','important');
            btn.style.setProperty('overflow','visible','important');
            btn.style.setProperty('transform','none','important');
          });
        }catch(_){ }
      }

      function prepareLogin(){
        try{
          var doc=frame.contentDocument;
          if(!doc)return;
          var email=doc.getElementById('loginEmail');
          var code=doc.getElementById('loginCode');
          var send=doc.getElementById('sendCodeButton');
          var enter=doc.getElementById('enterButton');
          [email,code,send,enter].forEach(function(el){
            if(!el)return;
            el.disabled=false;
            el.removeAttribute('disabled');
            el.removeAttribute('readonly');
            el.style.pointerEvents='auto';
          });
          if(email){
            email.tabIndex=0;
            email.autocomplete='email';
          }
        }catch(_){ }
      }

      function tryRestoreOnce(){
        if(restoreAttempted)return false;
        restoreAttempted=true;
        try{
          var persisted=localStorage.getItem(KEY)||'';
          var win=getFrame();
          if(!win||!persisted)return false;
          var current=win.sessionStorage.getItem(KEY)||'';
          if(current)return false;
          win.sessionStorage.setItem(KEY,persisted);
          reloadForRestore=true;
          return true;
        }catch(_){return false;}
      }

      function syncSession(){
        try{
          var win=getFrame();
          var doc=frame.contentDocument;
          if(!win||!doc)return;
          var token=win.sessionStorage.getItem(KEY)||'';
          var persisted=localStorage.getItem(KEY)||'';
          var publicView=doc.getElementById('publicView');
          var loginVisible=!!(publicView&&!publicView.hidden);
          if(token){if(token!==persisted)localStorage.setItem(KEY,token);return;}
          if(loginVisible){if(persisted&&restoreAttempted)localStorage.removeItem(KEY);prepareLogin();}
        }catch(_){ }
      }

      function injectEnhancements(){
        if(enhanced)return;
        enhanced=true;
        try{
          var doc=frame.contentDocument;
          if(!doc)return;
          styles.forEach(function(href){var l=doc.createElement('link');l.rel='stylesheet';l.href='./'+href;doc.head.appendChild(l);});
          var i=0;
          function next(){
            if(i>=scripts.length){forceMobileMenu();return;}
            var s=doc.createElement('script');
            s.src='./'+scripts[i++];s.async=false;s.onload=next;s.onerror=next;doc.body.appendChild(s);
          }
          next();
        }catch(_){ }
      }

      frame.addEventListener('load',function(){
        prepareLogin();
        if(!reloadForRestore&&tryRestoreOnce()){frame.contentWindow.location.reload();return;}
        if(reloadForRestore)reloadForRestore=false;
        setTimeout(function(){syncSession();prepareLogin();injectEnhancements();forceMobileMenu();},250);
        [500,1000,1800,3000,5000].forEach(function(ms){setTimeout(forceMobileMenu,ms);});
      });

      setInterval(function(){syncSession();prepareLogin();forceMobileMenu();},750);
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js?v=202610051245', { scope: './' }).catch(function () {});
      });
    }
  </script>
</body>
</html>
