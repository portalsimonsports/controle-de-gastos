<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Controle de Gastos</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#0c1422;overflow:hidden}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c1422}
  </style>
</head>
<body>
  <iframe id="app" title="Controle de Gastos" src="./app.html?build=202609240550"></iframe>
  <script>
    (function(){
      'use strict';
      var frame=document.getElementById('app');
      var KEY='cg_token';

      function copyPersistedToFrame(){
        try{
          var persisted=localStorage.getItem(KEY)||'';
          var win=frame.contentWindow;
          if(!win)return;
          var current=win.sessionStorage.getItem(KEY)||'';
          if(persisted && !current){
            win.sessionStorage.setItem(KEY,persisted);
            win.location.reload();
          }
        }catch(_){ }
      }

      function syncFromFrame(){
        try{
          var win=frame.contentWindow;
          if(!win)return;
          var token=win.sessionStorage.getItem(KEY)||'';
          var persisted=localStorage.getItem(KEY)||'';
          if(token && token!==persisted){
            localStorage.setItem(KEY,token);
          }else if(!token && persisted){
            localStorage.removeItem(KEY);
          }
        }catch(_){ }
      }

      frame.addEventListener('load',function(){
        copyPersistedToFrame();
        syncFromFrame();
      });

      setInterval(syncFromFrame,500);
    })();
  </script>
</body>
</html>
